version: 1
last_updated: "2026-05-21"

stages:
  - id: 1
    name: Inbound
    definition: "Free trial signup or contact form submitted"
    entry_criteria: "Lead exists in CRM"
    exit_to_next: "ICP qualified + buying intent observed"
    target_conversion_to_next: 0.60
    typical_days_in_stage: 1

  - id: 2
    name: Qualified
    definition: "Matches ICP per state/icp.yaml + has buying signal"
    entry_criteria: "Enrichment complete; ICP score is hot/warm"
    exit_to_next: "Demo scheduled on calendar"
    target_conversion_to_next: 0.50
    typical_days_in_stage: 4

  - id: 3
    name: Demo Booked
    definition: "Calendar invite accepted"
    entry_criteria: "Date/time confirmed"
    exit_to_next: "Demo happened with decision-maker or champion present"
    target_conversion_to_next: 0.80
    typical_days_in_stage: 7

  - id: 4
    name: Demo Done
    definition: "Product demonstrated; champion identified"
    entry_criteria: "Demo notes filed; champion named"
    exit_to_next: "Customer has connected real data and is actively evaluating"
    target_conversion_to_next: 0.50
    typical_days_in_stage: 10

  - id: 5
    name: POC
    definition: "Customer evaluating with real data + eval criteria documented"
    entry_criteria: "Real event volume >100k; eval criteria written"
    exit_to_next: "Quote / proposal sent"
    target_conversion_to_next: 0.60
    typical_days_in_stage: 14

  - id: 6
    name: Proposal
    definition: "Quote, contract, security questionnaire delivered"
    entry_criteria: "Proposal document sent + opened"
    exit_to_next: "Signed contract"
    target_conversion_to_next: 0.70
    typical_days_in_stage: 14

  - id: 7
    name: Closed-Won
    definition: "Contract signed and first payment received"
    terminal: true
    target_conversion_to_next: null

  - id: 8
    name: Closed-Lost
    definition: "Customer declined or went dark for >30 days"
    terminal: true
    reason_codes:
      - product_fit
      - price
      - timing
      - competition
      - no_champion
      - no_response
