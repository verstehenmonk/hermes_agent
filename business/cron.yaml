# Declarative cron jobs for the business operating system.
# Apply with: business/install.sh
# Each entry becomes a `hermes cron create` call.

jobs:

  - name: "Daily metrics snapshot"
    schedule: "20 7 * * 1-5"  # 07:20 weekdays
    prompt: "Snapshot generated. Nothing to say; daily brief follows at 07:30."
    script: "business/scripts/metrics_snapshot.py"
    deliver: "telegram"
    silent_on: ["SILENT"]

  - name: "Inbox triage snapshot"
    schedule: "25 7 * * 1-5"
    prompt: "Inbox digest generated. [SILENT]"
    script: "business/scripts/inbox_digest.py"
    deliver: "telegram"
    silent_on: ["SILENT"]

  - name: "Daily brief"
    schedule: "30 7 * * 1-5"  # 07:30 weekdays
    prompt: |
      Run the daily standup ritual. Read business/rituals/daily-standup.md
      and follow it exactly. Read business/CHARTER.md and
      business/north-star.md for context. Read
      ~/.hermes/business/metrics/latest.json for numbers and
      ~/.hermes/business/inbox/latest.json for inbox state.
      Compare to yesterday's standup at
      ~/.hermes/business/journal/<yesterday>-standup.md if present.
      Archive your output via:
        business/scripts/journal.py standup
    skills: ["ceo"]
    deliver: "telegram"

  - name: "Inbox sweep"
    schedule: "0 10-17/2 * * 1-5"  # every 2h, 10:00–16:00 weekdays
    prompt: |
      Read ~/.hermes/business/inbox/latest.json (run inbox_digest.py first if stale).
      For each item in 'customer' and 'sales' buckets, load the matching
      department skill and act per its triage rubric. If something genuinely
      needs founder attention, surface a concise note. If nothing does,
      reply with [SILENT].
    script: "business/scripts/inbox_digest.py"
    skills: ["customer-success", "sales"]
    deliver: "telegram"
    silent_on: ["SILENT"]

  - name: "End-of-day wrap"
    schedule: "0 18 * * 1-5"
    prompt: |
      Brief end-of-day note: what shipped today (GitHub PRs merged, content
      published, deals closed), what slipped (open PRs > 24h, open P1s),
      and what tomorrow's pre-loaded priorities should be.
      Keep it under 8 lines.
    skills: ["ceo"]
    deliver: "telegram"

  - name: "Weekly review"
    schedule: "0 16 * * 5"  # Friday 16:00
    prompt: |
      Run the weekly review ritual. Read business/rituals/weekly-review.md
      and follow it exactly. Read CHARTER, north-star, every department brief,
      and the past week's standup journals from
      ~/.hermes/business/journal/. Call each department skill in sequence
      and assemble the email. Archive via:
        business/scripts/journal.py weekly
    skills: ["ceo", "engineering", "product", "marketing", "sales", "customer-success", "finance", "operations", "legal"]
    deliver: "email"

  - name: "Monday kickoff"
    schedule: "0 9 * * 1"
    prompt: |
      Short Monday kickoff. State the three bets for the week (sliced from
      the quarter's bets in CHARTER), then list this week's commitments
      from the calendar. Keep under 10 lines.
    skills: ["ceo", "operations"]
    deliver: "telegram"

  - name: "Monthly close"
    schedule: "0 9 1 * *"
    prompt: |
      Run the monthly close ritual. Read business/rituals/monthly-close.md
      and follow it. Use metrics_snapshot.py --month-close (already run).
      Archive via:
        business/scripts/journal.py monthly
    script: "business/scripts/metrics_snapshot.py --month-close"
    skills: ["ceo", "finance", "product", "engineering", "marketing"]
    deliver: "email"

  - name: "Quarterly OKR review"
    # First Monday of Jan/Apr/Jul/Oct at 09:00.
    schedule: "0 9 1-7 1,4,7,10 1"
    prompt: |
      Run the quarterly OKR ritual. Follow business/rituals/quarterly-okrs.md
      exactly. Read CHARTER's "three bets this quarter" plus the last 12
      weekly journals and the last three monthly closes. Do NOT modify
      CHARTER.md — only draft proposed next quarter.
    skills: ["ceo"]
    deliver: "email"

  - name: "Vendor audit"
    schedule: "0 10 2 * *"  # 2nd of month, 10:00
    prompt: |
      Pull last month's Mercury transactions. Cross-reference against the
      Notion 'Vendor Registry'. Flag: unaccounted charges, vendors with
      last_used > 60d, and any vendor whose monthly charge grew > 25%.
      Output a one-page memo with a recommendation per row.
    skills: ["operations", "finance"]
    deliver: "email"

  - name: "Quarterly compliance check"
    schedule: "0 10 15 1,4,7,10 *"  # mid-quarter
    prompt: |
      Run the legal department's quarterly compliance check (see brief).
      Cover: contracts up for renewal in 90d, sub-processors list current,
      DSAR queue health, SOC 2 evidence gaps, open security advisories,
      ToS/PP age. Output a checklist + flagged items.
    skills: ["legal", "engineering"]
    deliver: "email"

  - name: "Runway health check"
    schedule: "0 9 * * 1"  # Monday morning, before kickoff
    prompt: |
      Read ~/.hermes/business/metrics/latest.json. If runway_months < 6,
      page the founder with a P1 Telegram message: current runway, recent
      burn trend, and three concrete suggestions (in priority order).
      Otherwise, reply with [SILENT].
    skills: ["finance", "ceo"]
    deliver: "telegram"
    silent_on: ["SILENT"]
